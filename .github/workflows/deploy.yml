name: Ciel AI Deployment

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ===========================
      # Gateway
      # ===========================

      - name: Build Gateway
        run: |
          docker build \
            -f backend/gateway/Dockerfile \
            -t gateway backend

      - name: Tag Gateway Image
        run: |
          docker tag gateway:latest \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/gateway:latest

      - name: Push Gateway Image
        run: |
          docker push \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/gateway:latest

      # ===========================
      # Agent
      # ===========================

      - name: Build Agent
        run: |
          docker build \
            -f backend/services/agent/Dockerfile \
            -t agent-service backend

      - name: Tag Agent Image
        run: |
          docker tag agent-service:latest \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/agent-service:latest

      - name: Push Agent Image
        run: |
          docker push \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/agent-service:latest

      # ===========================
      # Auth
      # ===========================

      - name: Build Auth
        run: |
          docker build \
            -f backend/services/auth/Dockerfile \
            -t auth-service backend

      - name: Tag Auth Image
        run: |
          docker tag auth-service:latest \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/auth-service:latest

      - name: Push Auth Image
        run: |
          docker push \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/auth-service:latest

      # ===========================
      # Chat
      # ===========================

      - name: Build Chat
        run: |
          docker build \
            -f backend/services/chat/Dockerfile \
            -t chat-service backend

      - name: Tag Chat Image
        run: |
          docker tag chat-service:latest \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/chat-service:latest

      - name: Push Chat Image
        run: |
          docker push \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/chat-service:latest

      # ===========================
      # Billing
      # ===========================

      - name: Build Billing
        run: |
          docker build \
            -f backend/services/billing/Dockerfile \
            -t billing-service backend

      - name: Tag Billing Image
        run: |
          docker tag billing-service:latest \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/billing-service:latest

      - name: Push Billing Image
        run: |
          docker push \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/billing-service:latest

      # ===========================
      # Deploy Gateway
      # ===========================

      - name: Deploy Gateway
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --service ${{ secrets.GATEWAY_SERVICE }} \
            --force-new-deployment

      # ===========================
      # Deploy Agent
      # ===========================

      - name: Deploy Agent
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --service ${{ secrets.AGENT_SERVICE }} \
            --force-new-deployment

      # ===========================
      # Deploy Auth
      # ===========================

      - name: Deploy Auth
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --service ${{ secrets.AUTH_SERVICE }} \
            --force-new-deployment

      # ===========================
      # Deploy Chat
      # ===========================

      - name: Deploy Chat
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --service ${{ secrets.CHAT_SERVICE }} \
            --force-new-deployment

      # ===========================
      # Deploy Billing
      # ===========================

      - name: Deploy Billing
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --service ${{ secrets.BILLING_SERVICE }} \
            --force-new-deployment

  deploy-frontend:
    needs: deploy-backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        run: |
          aws s3 sync \
            frontend/dist \
            s3://${{ secrets.S3_BUCKET_NAME }} \
            --delete

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"